<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="This page could not be found on SOT Alliance. Return to the main site and keep sailing." />
    <meta name="theme-color" content="#050708" />
    <title>SOT Alliance | 404 Not Found</title>
    <style>
      :root {
        --gold: #d6a936;
        --gold-light: #ffe08a;
        --black: #050708;
        --dark: #061b25;
        --muted: #a8b3b7;
        --white: #f5f2e9;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(20, 63, 78, 0.7), transparent 40%),
          linear-gradient(180deg, #020609 0%, #061b25 42%, #02090d 100%);
        color: var(--white);
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }

      .card {
        width: min(760px, 100%);
        padding: 48px 32px;
        border: 1px solid rgba(214, 169, 54, 0.35);
        border-radius: 18px;
        background: rgba(8, 20, 25, 0.88);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      .eyebrow {
        color: var(--gold-light);
        letter-spacing: 0.45rem;
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 18px;
        font-size: clamp(3rem, 9vw, 7rem);
        line-height: 0.9;
        color: var(--gold);
        font-family: Georgia, serif;
      }

      p {
        max-width: 560px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 12px 22px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        background: linear-gradient(135deg, #b68722, #f1d06b);
        color: #090909;
      }

      .btn-secondary {
        border: 1px solid rgba(214, 169, 54, 0.5);
        background: rgba(214, 169, 54, 0.06);
        color: var(--white);
      }

      @media (max-width: 600px) {
        .card {
          padding: 36px 20px;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">SOT Alliance</div>
      <h1>404</h1>
      <p>
        This page has drifted off course. The crew is still here, and the rest of the
        alliance is waiting on the main deck.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/index.html">Return Home</a>
        <a class="btn btn-secondary" href="/plans.html">View Membership</a>
      </div>
    </div>
  </body>
</html>
